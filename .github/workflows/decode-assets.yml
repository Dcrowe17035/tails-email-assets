name: Decode email assets

on:
  push:
    paths:
      - "b64/**"
      - ".github/workflows/decode-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Join parts and decode to binary PNG/JPEG
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          import base64
          from collections import defaultdict
          b64dir = Path('b64')
          parts = defaultdict(list)
          for p in sorted(b64dir.glob('*.b64.part*')):
              stem = p.name.split('.b64.part')[0]
              parts[stem].append(p.read_text().strip())
          for stem, chunks in parts.items():
              data = ''.join(chunks)
              (b64dir / f'{stem}.b64').write_text(data)
              print('joined', stem, len(data))
          for f in sorted(b64dir.glob('*.b64')):
              name = f.name[:-4]
              raw = base64.b64decode(f.read_text().strip())
              Path(name).write_bytes(raw)
              print('decoded', name, len(raw))
          PY
          ls -la *.jpg *.png
      - name: Commit binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- *.jpg *.png
          if git diff --cached --quiet; then
            echo "no binary changes"
          else
            git commit -m "Add decoded PNG/JPEG email assets"
            git push
          fi
